name: CI

# Verifies DPS still typechecks, lints and builds.
#
# Deliberately a single npm job on Node 20, matching `node:20-alpine` in the
# Dockerfile: CI should exercise the runtime we actually ship, not a matrix of
# runtimes and package managers we never deploy on. The repo is npm-only —
# package-lock.json, the `workspaces` field, `.npmrc` and the `overrides` block
# are all npm-specific — so yarn and pnpm legs could only ever produce noise.
#
# Nothing here touches Coolify. Deploys happen when Coolify pulls `main` on its
# own webhook, independent of this workflow's result.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    env:
      # Prisma refuses to resolve `env("DATABASE_URL")` without a value, and
      # both steps below read the datasource block. Nothing connects — this is
      # a placeholder to satisfy schema parsing, not a real database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must precede typechecking: app code imports types from @prisma/client,
      # which do not exist until the client is generated.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build
